<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>it's not a sandwich</title>
<style>
  /* Self-hosted fonts (Gelasio = Georgia-style serif, JetBrains Mono). Upload the fonts/ folder next to this file. */
  @font-face { font-family: "Gelasio"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/gelasio-roman.woff2) format("woff2"); }
  @font-face { font-family: "Gelasio"; font-style: italic; font-weight: 400 700; font-display: swap; src: url(fonts/gelasio-italic.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400 500; font-display: swap; src: url(fonts/jetbrains-mono.woff2) format("woff2"); }
  /* ---- Hero typography: copy everything from here to the end of .hero rules ---- */
  :root {
    --cream: #f1e9d6;
    --ink: #1a1714;
    --mustard: #dba623;
    --muted: #6e675c;
    --serif: "Gelasio", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  body { margin: 0; background: var(--cream); color: var(--ink); }

  .hero {
    background: var(--cream);
    color: var(--ink);
    padding: clamp(48px, 9vw, 96px) clamp(20px, 4vw, 40px) clamp(32px, 5vw, 56px);
    font-family: var(--serif);
  }
  .hero__title {
    margin: 0;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    font-size: clamp(56px, 9.5vw, 86px);
  }
  .hero__title .l { display: block; }
  .hero__it { font-style: italic; font-size: 0.58em; line-height: 1; }
  .hero__block {
    display: inline-block;
    padding: 0 0.08em 0.02em 0.1em;
    line-height: 1;
    font-style: normal;
  }
  .hero__block--ink { background: var(--ink); color: var(--cream); }
  .hero__block--mustard { background: var(--mustard); color: var(--ink); }
  .hero__a { font-style: italic; margin-right: 0.08em; }

  .hero__mark {
    display: flex;
    align-items: center;
    gap: 36px;
    height: 0.8em;
    font-size: clamp(56px, 9.5vw, 86px);
  }
  .hero__mark svg { width: 0.98em; height: auto; flex: none; }
  .hero__caption {
    font-family: var(--mono);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hero__sub {
    margin: 0.9em 0 0;
    max-width: 18em;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(20px, 2.6vw, 25px);
    line-height: 1.6;
  }

  .hero__cta { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 56px; }
  .hero__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 64px;
    padding: 0 38px;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--ink);
    transition: background .15s, color .15s;
  }
  .hero__btn--solid { background: var(--ink); color: var(--cream); }
  .hero__btn--solid:hover { background: var(--mustard); color: var(--ink); border-color: var(--mustard); }
  .hero__btn--ghost { background: transparent; color: var(--ink); }
  .hero__btn--ghost:hover { background: var(--ink); color: var(--cream); }
  @media (max-width: 520px) {
    .hero__mark { gap: 18px; }
    .hero__caption { font-size: 11px; letter-spacing: 0.2em; }
    .hero__cta { gap: 12px; margin-top: 40px; }
    .hero__btn { flex: 1 1 100%; min-height: 56px; font-size: 15px; }
  }
  .hero__btn:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
</style>
</head>
<body>

<section class="hero">
  <h1 class="hero__title" aria-label="it's not a sandwich.">
    <span class="l hero__it" aria-hidden="true">it</span>
    <span class="l" aria-hidden="true"><span class="hero__block hero__block--ink">’s not</span></span>
    <span class="hero__mark" aria-hidden="true">
      <svg viewBox="0 0 88 72" fill="none" stroke="#dba623" stroke-width="7">
        <line x1="2" y1="36" x2="24" y2="36"/>
        <line x1="62" y1="36" x2="86" y2="36"/>
        <line x1="54" y1="2" x2="24" y2="70"/>
      </svg>
      <span class="hero__caption">The logo is the answer</span>
    </span>
    <span class="l" aria-hidden="true"><span class="hero__a">a</span><span class="hero__block hero__block--mustard">sandwich</span>.</span>
  </h1>

  <p class="hero__sub">(it’s a japanese sando, sold in münchen, in deli paper.)</p>

  <div class="hero__cta">
    <a class="hero__btn hero__btn--solid" href="#speisekarte">Speisekarte</a>
    <a class="hero__btn hero__btn--ghost" href="#liefergebiet">Liefergebiet</a>
  </div>
</section>

</body>
</html>
